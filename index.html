<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Aero Lab 2.0</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#06111d;
color:white;
font-family:Arial,sans-serif
}
main{
max-width:900px;
margin:auto;
padding:20px 15px 50px
}
header{text-align:center;padding:20px}
h1{color:#42d9ee;font-size:42px;margin:0}
.sub{letter-spacing:3px;margin-top:8px}
.card{
background:#102235;
border:1px solid #29445c;
border-radius:18px;
padding:20px;
margin-top:15px
}
.control{margin:18px 0}
.row{
display:flex;
justify-content:space-between;
margin-bottom:7px
}
.value{
color:#42d9ee;
font-weight:bold
}
input,select,button{width:100%}
input{accent-color:#42d9ee}
select,button{
padding:12px;
border-radius:10px;
background:#071521;
color:white;
border:1px solid #29445c
}
button{
background:#42d9ee;
color:#06111d;
font-weight:bold;
border:0;
margin-top:8px
}
.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px
}
.stat{
background:#081725;
border:1px solid #29445c;
border-radius:12px;
padding:12px;
text-align:center;
font-size:12px
}
.stat b{
display:block;
color:#42d9ee;
font-size:21px;
margin-top:5px
}
.car{
height:210px;
margin-top:15px;
border-radius:14px;
background:#071521;
display:flex;
align-items:center;
overflow:hidden
}
.car svg{width:100%}
.flow{
stroke:#42d9ee;
stroke-width:3;
stroke-dasharray:10 12;
animation:move 1s linear infinite
}
@keyframes move{
to{stroke-dashoffset:-44}
}
.note{
font-size:12px;
color:#9db0c1;
margin-top:12px
}
@media(max-width:600px){
h1{font-size:36px}
.stats{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<main>

<header>
<h1>🏎️ F1 Aero Lab</h1>
<div class="sub">WIND TUNNEL · VERSION 2.0</div>
</header>

<section class="card">

<h2>⚙️ 风洞参数</h2>

<div class="control">
<div class="row">
<span>Air Speed</span>
<span class="value" id="sv">250 km/h</span>
</div>
<input id="speed" type="range" min="80" max="360" value="250">
</div>

<div class="control">
<div class="row">
<span>Front Wing</span>
<span class="value" id="fwv">8°</
