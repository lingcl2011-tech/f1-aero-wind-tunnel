<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Aero Lab 2.0</title>

<style>
:root{
  --bg:#06111d;
  --panel:#102235;
  --panel2:#091827;
  --line:#27445d;
  --cyan:#42d9ee;
  --red:#ff4053;
  --text:#ffffff;
  --muted:#9db0c1;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% 0%,#12314a 0,#06111d 45%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px 15px 50px;
}

header{
  text-align:center;
  padding:15px 0 25px;
}

h1{
  margin:0;
  font-size:clamp(34px,8vw,60px);
  color:var(--cyan);
}

.subtitle{
  margin-top:8px;
  color:#d5e0e8;
  letter-spacing:3px;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:16px;
}

.card{
  background:rgba(16,34,53,.95);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  box-shadow:0 12px 35px #0005;
}

h2{
  margin:0 0 18px;
}

.control{
  margin:18px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.value{
  color:var(--cyan);
  font-size:19px;
  font-weight:bold;
}

input[type=range]{
  width:100%;
  accent-color:var(--cyan);
}

select,
button{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#071521;
  color:white;
  font-size:15px;
}

button{
  margin-top:8px;
  background:var(--cyan);
  color:#031018;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 5px;
  text-align:center;
  font-size:12px;
}

.stat strong{
  display:block;
  margin-top:6px;
  color:var(--cyan);
  font-size:22px;
}

.car{
  height:280px;
  margin-top:15px;
  border-radius:15px;
  overflow:hidden;
  background:
    radial-gradient(ellipse,#173c55,#07131f 68%);
}

svg{
  width:100%;
  height:100%;
}

.flow{
  fill:none;
  stroke:var(--cyan);
  stroke-width:2;
  stroke-dasharray:8 10;
  animation:air 1s linear infinite;
  opacity:.75;
}

@keyframes air{
  to{
    stroke-dashoffset:-36;
  }
}

canvas{
  width:100%;
  height:180px;
  margin-top:15px;
  background:#071521;
  border-radius:12px;
}

.note{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin-top:10px;
}

.status{
  text-align:center;
  margin-top:12px;
  color:var(--cyan);
  font-size:13px;
}

@media(max-width:760px){
  .grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  .car{
    height:230px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>🏎️ F1 Aero Lab</h1>
<div class="subtitle">WIND TUNNEL · VERSION 2.0</div>
</header>

<div class="grid">

<!-- LEFT -->
<section class="card">

<h2>⚙️
